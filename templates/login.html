{% extends 'base.html' %}
{% load static %}
{% block title %}Member Login{% endblock %}

{% block content %}
<div class="container-fluid my_bg my_bg_post">
<div class="container shadow">
    <div align="center" style="padding-top:50px;">
      <h4>會員登入</h4>
    </div>
    <div style="padding:20px 0 30px 100px">
      <form action="." method="post">
        {% csrf_token %}
        <table class="login">
              {{ login_form.as_table }}
        </table>
        <br>
        <button class="btn btn-light my_btn" type="submit" value="登入">
          <span>登入</span>
        </button>
      </form>
    </div>
</div>
</div>

<style>
.my_bg {
    background-image: linear-gradient(rgba(203, 198, 191, 0.9), rgba(203, 198, 191, 0.9)), url('{% static 'img/bg-log.png' %}');
  }
.container{
  position:relative;
  top:100px;
  background:rgba(255, 255, 255, 0.5);
  display:block;
  margin-bottom:80px;
  width:600px;
  height:360px;
  border-radius:13px;
  overflow:hidden;
  z-index:1;
}

.login input{
  display:block;
  background-color: rgba(255, 255, 255, 0.3);
  height:50px;
  width:300px;
  margin:0 auto;
  border:none;
  &::placeholder{
    -webkit-transform:translateY(0px);
      transform:translateY(0px);
    -webkit-transition:.5s;
      transition:.5s;
  }
  &:hover,
  &:focus,
  &:active:focus{
    color:#ff5722;
    outline:none;
    border-bottom:1px solid #ff5722;
    &::placeholder{
      color:#ff5722;
      position:relative;
      -webkit-transform:translateY(-20px);
      transform:translateY(-20px);

    }
  }
}

.pwd{
  position:relative;
  z-index:1;
  border-bottom:1px solid rgba(0,0,0,.1);
  padding-left:20px;
  font-family: 'Open Sans', sans-serif;
  text-transform:uppercase;
  color:#858585;
  font-weight:lighter;
  -webkit-transition:.5s;
  transition:.5s;
}

.my_btn{
  cursor:pointer;
  display:inline-block;
  float:left;
  width:80%;
  height:60px;
  margin-top:-10px;
  border:none;
  font-family: 'Open Sans', sans-serif;
  text-transform:uppercase;
  color:#fff;
  -webkit-transition:.5s;
  transition:.5s;
  &:nth-of-type(1){
    background:#827460;
  }
  &:nth-of-type(2){
    background:#CBC6BF;
  }
  span{
    position:absolute;
    color: white;
    display:inline;
    margin:-10px;
    text-align: center;
    -webkit-transform:translateX(0);
    transform:translateX(0);
    -webkit-transition:.5s;
    transition:.5s;
  }
  &:hover{
    span{
      -webkit-transform:translateX(10px);
      transform:translateX(10px);
      }
     }
   }
</style>
{% endblock %}
