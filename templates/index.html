{% extends 'base.html' %}
{% load static %}
{% block title %}Pick Your Flavor!{% endblock %}
{% block content %}
<div class="container-fluid" style="background: linear-gradient(rgba(116, 99, 74, 0.8), rgba(116, 99, 74, 0.8)), url('{% static 'img/bg.png' %}'); background-size: cover; background-position: center; height: 100vh;">
  <div class="row gx-4 gx-lg-5 h-100 align-items-center justify-content-center text-center">
      <div class="col-lg-8 align-self-end">
          <h1 class="text-white font-weight-bold">按你的條件，找到適合停留的咖啡廳</h1>
          <hr class="text-gray divider"/>
      </div>
      <div class="col-lg-8 align-self-baseline">
          <p class="text-white-75 mb-5">讀書打報告想換個環境，開始尋找適合的咖啡廳
            <br>然而茫茫社群海總是撈不到自己的favorite?
            <br>此網站讓你輕鬆pick your flavor！</p>
          <a class="btn btn-outline-light" href="/listing/">Start to Find!</a>
      </div>
  </div>
</div>
{% endblock %}
