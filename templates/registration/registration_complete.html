{% extends 'base.html' %}
{% load static %}
{% block title %}Sign up Complete{% endblock %}

{% block content %}
<div class="my_bg">
<div class="container">
        <div align="center" style="padding-top:50px;">
          <h4>感謝註冊</h4>
          <p>請到電子郵件中確認帳號</p>
        </div>
</div>
</div>
<style>
.my_bg {
    background-image: linear-gradient(rgba(203, 198, 191, 0.9), rgba(203, 198, 191, 0.9)), url('{% static 'img/bg-log.png' %}');
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    height: 100vh;
}
.container{
    position:relative;
    top:100px;
    padding-bottom: 50px;
    display:block;
    margin-bottom:80px;
    width:600px;
    background:rgba(255, 255, 255, 0.5);
    border-radius:13px;
    overflow:hidden;
    z-index:1;
    justify-content: center;
    align-items: center;
}

.shadow {
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}
  </style>
{% endblock %}
